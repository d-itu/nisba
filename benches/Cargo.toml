[package]
name = "nisba-benches"
version = "0.1.0"
edition = "2024"

[[bench]]
harness = false
name = "json"

[dev-dependencies]
bincode-next = "3.0.0-rc.11"
criterion = "0.8.2"
nisba = { path = "../crates/nisba" }
protobuf = "4.34.1-release"
protobuf-well-known-types = "4.34.1-release"
sonic-rs = "0.5.8"

[build-dependencies]
nisbac = { path = "../crates/nisbac" }
protobuf-codegen = "4.34.1-release"
protobuf-well-known-types = "4.34.1-release"
reqwest = { version = "0.13.2", features = ["blocking"] }
